name: banksatu_mobile
description: "BankSatu mobile application — consumer-facing digital banking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  go_router: ^17.2.3

  # Utilities & Typography
  google_fonts: ^8.1.0
  intl: ^0.20.2

  # DI
  get_it: ^8.0.3

  # HTTP
  dio: ^5.7.0

  # Code Generation Annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  go_router_builder: ^4.3.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
